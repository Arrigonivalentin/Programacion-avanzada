<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Flybondi Challenge - Nelsona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>✈️ Flybondi - Viajes para Nelsona</h1>
    <p>Presupuesto: $800 (ida y vuelta)</p>
  </header>

  <main>
    <section id="controls">
      <label for="sort">Ordenar por: </label>
      <select id="sort">
        <option value="cheap">Más baratos</option>
        <option value="availability">Mayor disponibilidad</option>
        <option value="date">Más cercanos en fecha</option>
      </select>
    </section>

    <section id="results"></section>
    <section id="recommendation"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
